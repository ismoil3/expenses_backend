# ============================================================
#  Amiri — деплой: бот + API + панел дар як стек.
#
#  Ин файл дар папкаи болоӣ мехобад, дар паҳлӯи ду репозиторий:
#
#    expenses/
#    ├─ backend/            git clone expenses_backend
#    ├─ frontend/           git clone expenses_frontend
#    ├─ docker-compose.yml  ← ҳамин файл
#    └─ .env                сирҳо (ба git намеравад)
#
#  Оғоз:  docker compose up -d --build
# ============================================================

name: amiri

services:
  db:
    container_name: amiri_db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amiri}
      # Бе парол оғоз намешавад — хатои возеҳ беҳтар аз базаи кушода
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?дар .env нест}
      POSTGRES_DB: ${POSTGRES_DB:-amiri}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Танҳо аз худи сервер — берун баста аст
      - "127.0.0.1:${DB_PORT:-5459}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amiri}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    container_name: amiri_api
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # База бо номи сервис дастрас аст — на бо localhost
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-amiri}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-amiri}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8347}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    container_name: amiri_web
    build:
      context: ./frontend
      args:
        # Холӣ: nginx худаш /api-ро ба `amiri_api` мегузаронад, яъне
        # панел ва API як origin доранд — cookie-и сессия бе мушкил кор
        # мекунад ва CORS лозим намешавад.
        VITE_API_URL: ""
        VITE_BOT_USERNAME: "${BOT_USERNAME:-amiri_expenses_bot}"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8348}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
